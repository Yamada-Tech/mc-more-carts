name: build

# main ブランチに push すると、ビルドして、そのまま GitHub の Releases に自動で公開します。
# (手でリリースを作る必要はありません)
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (Minecraft 26.3)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          rm -f build/libs/*-sources.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: more-carts-jar
          path: build/libs/*.jar

  # ビルドが終わったら、Releases に自動で公開する (プルリクエストのときは行わない)
  release:
    needs: mod
    # ビルドが失敗していたら公開しない
    if: ${{ needs.mod.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build results
        uses: actions/download-artifact@v4
        with:
          name: more-carts-jar
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # この処理ではリポジトリを checkout していないため、対象のリポジトリを明示する
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          TAG="build-${{ github.run_number }}"
          {
            echo "## 導入方法 (Minecraft 26.3 / Fabric サーバー)"
            echo
            echo "- サーバーの mods/ に \`more-carts-*.jar\` + Polymer \`polymer-bundled-0.18.2+26.3.jar\` (Modrinth) + Fabric API を入れる"
            echo "- クライアントはバニラでOK。見た目 (アイコン) は Polymer のリソースパック自動配信で届く"
            echo "- server.properties の設定変更は不要"
          } > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Build #${{ github.run_number }}" \
            --notes-file release-notes.md
